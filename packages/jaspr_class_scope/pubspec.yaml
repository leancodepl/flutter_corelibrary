name: jaspr_class_scope
version: 0.1.0
homepage: https://github.com/leancodepl/flutter_corelibrary/tree/master/packages/jaspr_class_scope
repository: https://github.com/leancodepl/flutter_corelibrary
description: >-
  Keeps one Jaspr component's styles out of another: every component gets
  scoped CSS class names of its own, so the same name can be reused anywhere.

topics:
  - css
  - jaspr
  - scoped-styles
  - styling
  - web

environment:
  sdk: '>=3.7.0 <4.0.0'

dev_dependencies:
  leancode_lint: ^27.0.0
  test: ^1.26.0
