name: jaspr_class_scope
version: 0.1.0
homepage: https://github.com/leancodepl/flutter_corelibrary/tree/master/packages/jaspr_class_scope
repository: https://github.com/leancodepl/flutter_corelibrary
description: >-
  Gives every Jaspr component its own CSS class names, so a name used in two
  components cannot make one component's styles apply to the other's markup.

topics:
  - css
  - jaspr
  - scoped-styles
  - styling
  - web

environment:
  sdk: '>=3.7.0 <4.0.0'

dev_dependencies:
  leancode_lint: ^27.0.0
  test: ^1.26.0
