# The extensions here are spelled again in `lib/src/scoped_components.dart` and
# `lib/src/class_scope_check_builder.dart`; build_runner reads this file without
# loading Dart, so it cannot share their constants. Keep the two in step.
builders:
  class_scope:
    import: 'package:jaspr_class_scope_builder/jaspr_class_scope_builder.dart'
    builder_factories: ['classScopeBuilder']
    build_extensions: {'.dart': ['.scopes.dart']}
    auto_apply: dependents
    build_to: source
    defaults:
      generate_for:
        exclude: ['**.scopes.dart']

  class_scope_check:
    import: 'package:jaspr_class_scope_builder/jaspr_class_scope_builder.dart'
    builder_factories: ['classScopeCheckBuilder']
    build_extensions: {'$package$': ['jaspr_class_scope.check']}
    auto_apply: dependents
    build_to: cache
