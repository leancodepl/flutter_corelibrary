name: leancode_debug_page test

on:
  push:
    branches: [master]
    paths:
      - 'packages/leancode_debug_page/**'
      - '.github/workflows/leancode_debug_page-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/leancode_debug_page/**'
      - '.github/workflows/leancode_debug_page-test.yml'

jobs:
  test:
    name: Flutter ${{ matrix.channel }}${{ matrix.version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.38.x'
          - channel: 'stable'

    defaults:
      run:
        working-directory: packages/leancode_debug_page

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Download pub dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: dart pub publish --dry-run || true

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@pana-score-v1.3
        with:
          path: packages/leancode_debug_page
