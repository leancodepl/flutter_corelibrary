name: leancode_hooks test

on:
  push:
    branches: [master]
    paths:
      - 'packages/leancode_hooks/**'
      - '.github/workflows/leancode_hooks-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/leancode_hooks/**'
      - '.github/workflows/leancode_hooks-test.yml'

jobs:
  test:
    name: Flutter ${{ matrix.channel }}${{ matrix.version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.35.x

    defaults:
      run:
        working-directory: packages/leancode_hooks

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Download pub dependencies
        run: flutter pub get

      - name: Run analyzer
        run: |
          flutter analyze
          dart run custom_lint

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: flutter pub publish --dry-run || true

      - uses: codecov/codecov-action@v7.1.1
        with:
          flags: leancode_hooks

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@pana-score-v1.3
        with:
          path: packages/leancode_hooks
