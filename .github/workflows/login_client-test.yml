name: login_client test

on:
  push:
    branches: [master]
    paths:
      - 'packages/login_client/**'
      - '.github/workflows/login_client-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/login_client/**'
      - '.github/workflows/login_client-test.yml'

jobs:
  test:
    name: Dart ${{ matrix.dart_release }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dart_release: ['3.3']

    defaults:
      run:
        working-directory: packages/login_client

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.dart_release }}

      - name: Dart version
        run: dart --version

      - name: Cache pub dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Download pub dependencies
        run: dart pub get

      - name: Run analyzer
        run: |
          dart analyze
          dart run custom_lint

      - name: Run tests with coverage
        run: |
          dart test --coverage=coverage
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: dart pub publish --dry-run || true

      - uses: codecov/codecov-action@v7.1.1
        with:
          flags: login_client

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@pana-score-v1.3
        with:
          path: packages/login_client
