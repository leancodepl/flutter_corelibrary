name: jaspr_class_scope_builder test

on:
  push:
    branches: [master]
    paths:
      - 'packages/jaspr_class_scope_builder/**'
      - '.github/workflows/jaspr_class_scope_builder-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/jaspr_class_scope_builder/**'
      - '.github/workflows/jaspr_class_scope_builder-test.yml'

jobs:
  test:
    name: Dart ${{ matrix.dart_release }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dart_release: ['3.13']

    defaults:
      run:
        working-directory: packages/jaspr_class_scope_builder

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ matrix.dart_release }}

      - name: Dart version
        run: dart --version

      - name: Cache pub dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Download pub dependencies
        run: dart pub get

      - name: Run analyzer
        run: dart analyze

      - name: Run format
        run: dart format . --set-exit-if-changed

      - name: Run tests
        run: dart test

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: dart pub publish --dry-run || true

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@pana-score-v1.3
        with:
          path: packages/jaspr_class_scope_builder
