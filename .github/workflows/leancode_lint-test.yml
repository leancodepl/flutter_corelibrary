name: leancode_lint test

on:
  push:
    branches: [master]
    paths:
      - 'packages/leancode_lint/**'
      - '.github/workflows/leancode_lint-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/leancode_lint/**'
      - '.github/workflows/leancode_lint-test.yml'

jobs:
  test:
    name: Flutter ${{ matrix.channel }}${{ matrix.version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.47.x

    defaults:
      run:
        working-directory: packages/leancode_lint

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Run lint rules tests
        run: dart test

      - uses: codecov/codecov-action@v7.1.1
        with:
          flags: leancode_lint

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@pana-score-v1.3
        with:
          path: packages/leancode_lint
