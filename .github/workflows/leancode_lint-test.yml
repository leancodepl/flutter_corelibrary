name: leancode_lint test

on:
  push:
    branches: [master]
    tags-ignore: ['leancode_lint-v*']
    paths:
      - 'packages/leancode_lint/**'
      - '.github/workflows/leancode_lint-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/leancode_lint/**'
      - '.github/workflows/leancode_lint-test.yml'

jobs:
  test:
    name: Flutter ${{ matrix.channel }}${{ matrix.version }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 3.41.x

    defaults:
      run:
        working-directory: packages/leancode_lint

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Run lint rules tests
        run: dart test

      - uses: codecov/codecov-action@v1
        with:
          flags: leancode_lint

      - name: Score with pana
        id: pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@68d925e42153f53e69d6c2501534f0c3c0a1a3be # v1.1
        with:
          path: packages/leancode_lint
