name: leancode_analytics_firebase test

on:
  push:
    branches: [master]
    tags-ignore: ['leancode_analytics_firebase-v*']
    paths:
      - 'packages/leancode_analytics_firebase/**'
      - 'packages/leancode_analytics_base/**'
      - '.github/workflows/leancode_analytics_firebase-test.yml'
  pull_request:
    branches: [master]
    paths:
      - 'packages/leancode_analytics_firebase/**'
      - 'packages/leancode_analytics_base/**'
      - '.github/workflows/leancode_analytics_firebase-test.yml'

jobs:
  test:
    name: Flutter ${{ matrix.channel }}${{ matrix.version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '3.24.x'
          - channel: 'stable'

    defaults:
      run:
        working-directory: packages/leancode_analytics_firebase

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Override local dependencies
        run: |
          echo "dependency_overrides:" > pubspec_overrides.yaml
          echo "  leancode_analytics_base:" >> pubspec_overrides.yaml
          echo "    path: ../leancode_analytics_base" >> pubspec_overrides.yaml

      - name: Download pub dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Dry run pub publish
        # We don't want it to fail the CI, it's just to see how would `pub publish` behave.
        run: dart pub publish --dry-run || true

  pana-score:
    name: pana score
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Score with pana
        continue-on-error: true
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        with:
          path: packages/leancode_analytics_firebase
